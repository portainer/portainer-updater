name: Build production docker image to Portainer

on:
  workflow_dispatch:
    inputs:
      unpacker_version:
        description: "portainer-updater version. e.g. 2.20.0"
        required: true
      release_branch:
        description: "release branch. e.g. release/2.20"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.release_branch }}

      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
        with:
          driver-opts: image=moby/buildkit:v0.10.6

      - uses: actions/setup-go@v3
        with:
          go-version: "1.22.5"

      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: build the image to portainer release ( Main Latest )
        run: |
          "${GITHUB_WORKSPACE}/build/build_and_push.sh" portainer
